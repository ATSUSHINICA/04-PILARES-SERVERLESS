
service: venue-control-api
frameworkVersion: ~4.45.0

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: dev
  iam:
    role: arn:aws:iam::188055787420:role/LabRole
 

plugins:
  - serverless-offline

functions:
  listZones:
    handler: dist/zones/list.handler
    events:
      - http:
          path: zones
          method: get
          cors: true

  getZone:
    handler: dist/zones/get.handler
    events:
      - http:
          path: zones/{id}
          method: get
          cors: true

  createZone:
    handler: dist/zones/create.handler
    events:
      - http:
          path: zones
          method: post
          cors: true

  replaceZone:
    handler: dist/zones/replace.handler
    events:
      - http:
          path: zones/{id}
          method: put
          cors: true

  updateZone:
    handler: dist/zones/update.handler
    events:
      - http:
          path: zones/{id}
          method: patch
          cors: true

  deleteZone:
    handler: dist/zones/delete.handler
    events:
      - http:
          path: zones/{id}
          method: delete
          cors: true
